plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.google.services)
}

// local.properties 에서 키/서버 설정 읽기
def holidayApiKey = ""
def notifyBaseUrl = ""
def notifySecret = ""
def haBaseUrl = ""
def haToken = ""
def lp = rootProject.file("local.properties")
if (lp.exists()) {
    def props = new Properties()
    lp.withInputStream { props.load(it) }
    holidayApiKey = props.getProperty("holiday.api.key", "")
    notifyBaseUrl = props.getProperty("notify.base.url", "")
    notifySecret = props.getProperty("notify.secret", "")
    haBaseUrl = props.getProperty("ha.base.url", "")
    haToken = props.getProperty("ha.token", "")
}

android {
    namespace 'com.familyboard.app'
    compileSdk 34

    defaultConfig {
        // Firebase 등록 패키지와 일치시킴. (내부 코드 패키지 namespace 는 com.familyboard.app 유지)
        applicationId "com.jun.family_board"
        minSdk 24
        targetSdk 34
        versionCode 134
        versionName "0.9.125"
        buildConfigField "String", "HOLIDAY_API_KEY", "\"${holidayApiKey}\""
        buildConfigField "String", "NOTIFY_BASE_URL", "\"${notifyBaseUrl}\""
        buildConfigField "String", "NOTIFY_SECRET", "\"${notifySecret}\""
        buildConfigField "String", "HA_BASE_URL", "\"${haBaseUrl}\""
        buildConfigField "String", "HA_TOKEN", "\"${haToken}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = libs.versions.composeCompiler.get()
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.activity.compose
    implementation libs.androidx.navigation.compose
    implementation libs.androidx.datastore.preferences
    implementation libs.coil.compose
    // 인앱 동영상 재생(재미진 곳 mp4)
    implementation "androidx.media3:media3-exoplayer:1.3.1"
    implementation "androidx.media3:media3-ui:1.3.1"
    // 초고해상도·초장문 이미지 타일 렌더(부분 디코딩) — 원본 화질 유지하며 확대
    implementation "com.davemorrissey.labs:subsampling-scale-image-view-androidx:3.10.0"
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.coroutines.play.services

    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.compose.material.icons.extended
    debugImplementation libs.compose.ui.tooling

    // Firebase (google-services.json 추가 후 실제 동기화 활성화). deps 는 지금도 컴파일됨.
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.firestore
    implementation libs.firebase.auth
    implementation libs.firebase.messaging
}
