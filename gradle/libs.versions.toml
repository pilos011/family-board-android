[versions]
agp                = "8.3.2"
kotlin             = "1.9.23"
coreKtx            = "1.13.1"
lifecycle          = "2.7.0"
activityCompose    = "1.8.2"
composeBom         = "2024.02.02"
composeCompiler    = "1.5.11"
navigationCompose  = "2.7.7"
coroutines         = "1.7.3"
datastore          = "1.0.0"
googleServices     = "4.4.1"
firebaseBom        = "32.8.1"
desugar            = "2.0.4"
coil               = "2.6.0"

[libraries]
androidx-core-ktx                = { group = "androidx.core",              name = "core-ktx",                       version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx   = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",          version.ref = "lifecycle" }
androidx-lifecycle-viewmodel     = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose",    version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle",       name = "lifecycle-runtime-compose",      version.ref = "lifecycle" }
androidx-activity-compose        = { group = "androidx.activity",          name = "activity-compose",               version.ref = "activityCompose" }
androidx-navigation-compose      = { group = "androidx.navigation",        name = "navigation-compose",             version.ref = "navigationCompose" }
androidx-datastore-preferences   = { group = "androidx.datastore",         name = "datastore-preferences",          version.ref = "datastore" }
kotlinx-coroutines-android       = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-android",     version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
desugar-jdk-libs                 = { group = "com.android.tools",          name = "desugar_jdk_libs",               version.ref = "desugar" }
coil-compose                     = { group = "io.coil-kt",                 name = "coil-compose",                   version.ref = "coil" }

# Compose BOM 관리 라이브러리 (버전 미지정 = BOM이 결정)
compose-bom          = { group = "androidx.compose",    name = "compose-bom",         version.ref = "composeBom" }
compose-ui           = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics  = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling         = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3    = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Firebase (google-services.json 추가 후 활성화)
firebase-bom         = { group = "com.google.firebase", name = "firebase-bom",             version.ref = "firebaseBom" }
firebase-firestore   = { group = "com.google.firebase", name = "firebase-firestore-ktx" }
firebase-auth        = { group = "com.google.firebase", name = "firebase-auth-ktx" }
firebase-messaging   = { group = "com.google.firebase", name = "firebase-messaging-ktx" }

[plugins]
android-application = { id = "com.android.application",      version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
google-services     = { id = "com.google.gms.google-services", version.ref = "googleServices" }
